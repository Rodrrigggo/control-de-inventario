<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - Almacén</title>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --site-primary: #123744;
            --site-background: #F2F6F8;
            --site-font-body: Inter, sans-serif;
        }
        body {
            font-family: var(--site-font-body);
            background-color: var(--site-background);
            margin: 0;
            padding: 0;
        }
        /* Estilos del Login */
        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        .auth-card h2 {
            margin-top: 0;
            color: var(--site-primary);
            text-align: center;
        }
        .auth-card input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .auth-card button {
            width: 100%;
            padding: 10px;
            background-color: var(--site-primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .auth-card button:hover {
            opacity: 0.9;
        }
        #error-msg {
            color: red;
            font-size: 14px;
            text-align: center;
        }
        /* Aplicación principal (oculta hasta iniciar sesión) */
        #app-container {
            display: none;
            padding: 20px;
        }
        .card-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="auth-container">
        <div class="auth-card">
            <h2>Control de Almacén</h2>
            <p style="text-align: center; font-size: 14px; color: #666;">Inicia sesión para continuar</p>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button onclick="handleLogin()">Ingresar</button>
            <p id="error-msg"></p>
        </div>
    </div>

    <!-- APLICACIÓN DE INVENTARIO -->
    <div id="app-container">
        <h1>Sistema de Control de Inventario</h1>
        <p>¡Bienvenido al sistema conectado a Supabase en tiempo real!</p>
        <button onclick="handleLogout()" style="padding: 8px 15px; background: #c0392b; color: white; border: none; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
        
        <!-- PANEL DE PRUEBA DE MOVIMIENTOS -->
        <div class="card-panel">
            <h3>Registrar Salida / Movimiento</h3>
            <input type="text" id="txt-producto" placeholder="Nombre o Código del Producto" style="padding: 8px; width: 280px; margin-right: 10px;">
            <input type="number" id="txt-cantidad" placeholder="Cantidad" style="padding: 8px; width: 100px; margin-right: 10px;">
            <button onclick="registrarMovimiento()" style="padding: 9px 15px; background: #123744; color: white; border: none; border-radius: 4px; cursor: pointer;">Registrar en la Nube</button>
        </div>

        <!-- LISTA EN TIEMPO REAL -->
        <div class="card-panel">
            <h3>Historial Sincronizado en Vivo</h3>
            <ul id="lista-movimientos"></ul>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // CONFIGURACIÓN DE SUPABASE (Declarada una sola vez)
        // ---------------------------------------------------------
        const SUPABASE_URL = 'https://smbcjlitgsbioyzfjmee.supabase.co';
        const SUPABASE_ANON_KEY = 'AQUÍ_PEGA_TU_ANON_KEY'; // Reemplaza con tu llave anon

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------------------------------------------------------
        // GESTIÓN DE SESIÓN
        // ---------------------------------------------------------
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                iniciarSistema();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.innerText = "Error: Credenciales incorrectas.";
            } else {
                errorMsg.innerText = "";
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                iniciarSistema();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('auth-container').style.display = 'flex';
        }

        // ---------------------------------------------------------
        // LÓGICA DE INVENTARIO Y TIEMPO REAL
        // ---------------------------------------------------------
        async function cargarMovimientos() {
            const { data: movimientos, error } = await supabaseClient
                .from('inventory_movements')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error al obtener movimientos:", error);
                return;
            }

            const lista = document.getElementById('lista-movimientos');
            if (lista) {
                lista.innerHTML = '';
                movimientos.forEach(m => {
                    const li = document.createElement('li');
                    li.innerText = `[${m.operation || 'SALIDA'}] Producto: ${m.source_key || 'N/A'} - Cantidad: ${m.quantity || 0} (Usuario: ${m.user_email || 'Anónimo'})`;
                    lista.appendChild(li);
                });
            }
        }

        async function registrarMovimiento() {
            const producto = document.getElementById('txt-producto').value;
            const cantidad = document.getElementById('txt-cantidad').value;

            if (!producto || !cantidad) {
                alert("Por favor completa el producto y la cantidad.");
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();

            const { error } = await supabaseClient
                .from('inventory_movements')
                .insert([
                    {
                        operation: 'SALIDA',
                        source_key: producto,
                        quantity: parseFloat(cantidad),
                        user_email: user ? user.email : 'desconocido'
                    }
                ]);

            if (error) {
                console.error("Error al registrar:", error);
                alert("Error al guardar: " + error.message);
            } else {
                document.getElementById('txt-producto').value = '';
                document.getElementById('txt-cantidad').value = '';
                console.log("¡Movimiento registrado con éxito!");
            }
        }

        function activarSincronizacionEnVivo() {
            supabaseClient
                .channel('cambios-inventory-movements')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'inventory_movements' },
                    (payload) => {
                        console.log('¡Cambio detectado en tiempo real!', payload);
                        cargarMovimientos();
                    }
                )
                .subscribe();
        }

        async function iniciarSistema() {
            await cargarMovimientos();
            activarSincronizacionEnVivo();
        }

        // Comprobar la sesión al cargar la página
        checkSession();
    </script>
</body>
</html>
